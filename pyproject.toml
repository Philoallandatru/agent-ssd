[project]
name = "agent-test-framework"
version = "0.1.0"
description = "Pluggable harness for running agent workloads against an SSD under test."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = ["pytest>=7.0"]

[project.scripts]
agent-bench = "framework.cli:main"

[tool.setuptools.packages.find]
include = ["framework*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
